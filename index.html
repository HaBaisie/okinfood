<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Okin Food Supermarket</title>
<meta name="description" content="Order Nigerian foodstuff, groceries and household items online from Okin Food Supermarket.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="announce" id="announce"></div>
<header class="top">
  <div class="wrap bar">
    <button class="menubtn" id="menuBtn" aria-label="Browse categories">Menu</button>
    <a class="logo" href="#/">OKIN<span>FOOD</span></a>
    <form class="search" id="searchForm" role="search">
      <input type="search" id="q" placeholder="Search for yam, rice, palm oil…" aria-label="Search products">
      <button>Search</button>
    </form>
    <a class="cartlink" href="#/cart">Basket <span class="badge" id="badge">0</span></a>
  </div>
  <nav class="wrap cats" id="catnav" aria-label="Categories"></nav>
</header>
<div class="toast" id="toast" hidden></div>
<main class="wrap" id="app"><p class="muted" style="padding:40px 0">Loading…</p></main>

<div class="cartbar" id="cartbar" hidden></div>

<footer class="foot">
  <div class="wrap cols" id="footinfo"></div>
  <p class="copy">© <span id="yr"></span> Okin Food Supermarket. All rights reserved.</p>
</footer>

<!-- Netlify Forms: lets Netlify detect the "order" form. Orders are emailed from here. -->
<form name="order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="ref"><input name="name"><input name="phone"><input name="email">
  <input name="method"><input name="address"><input name="payment"><input name="note">
  <textarea name="items"></textarea>
  <input name="subtotal"><input name="delivery_fee"><input name="total">
</form>

<script src="app.js"></script>
</body>
</html>
